# Standalone Mouse deployment. Run this on the server that owns the channel
# network/proxy. SPRING_URL must be reachable from this container; nothing needs
# to reach the container, so the node can sit behind NAT without a port mapping.

services:
  mouse:
    build:
      context: .
      dockerfile: Dockerfile.mouse
    image: ${MOUSE_IMAGE:-choarkinphe/spring-mouse-agent:latest}
    container_name: spring-mouse-agent
    restart: always
    environment:
      SPRING_URL: ${SPRING_URL:-}
      MOUSE_TOKEN: ${MOUSE_TOKEN:-}
      MOUSE_HEALTH_PORT: 9101
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - mouse-agent-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9101/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-20m}"
        max-file: "${DOCKER_LOG_MAX_FILES:-3}"

volumes:
  mouse-agent-data:
    name: spring-mouse-agent-data
