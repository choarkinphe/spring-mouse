name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/spring-mouse

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js for release checks
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install application and test dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix tests ci --ignore-scripts --no-audit --no-fund
      - name: Run critical request-path regression tests
        working-directory: tests
        # The tunnel suite builds an isolated database in beforeAll, which
        # exceeds vitest's 10s default hook budget on a cold runner.
        #
        # This is a curated subset, not the whole suite (see tests/README or the
        # baseline notes for the full run). It is the set of paths where a
        # regression is both plausible and expensive: the request lifecycle, the
        # usage aggregation the dashboard reads, and the schema migrations that
        # run on every boot. Add to it when a change touches those.
        #
        # `traffic-repo` is here because a refactor of usageRepo once dropped a
        # helper it still called, and nothing in this list noticed until the
        # request-details page 500'd in production.
        run: >-
          npm exec vitest run --
          --config vitest.config.js
          --hookTimeout=90000
          unit/network-traffic.test.js
          unit/ingress-usage.test.js
          unit/embedding-usage-persistence.test.js
          unit/fetch-success-clears-account.test.js
          unit/xai-video-handler.test.js
          unit/mouse-tunnel.test.js
          unit/account-schedule.test.js
          unit/traffic-repo.test.js
          unit/db-migration-chain.test.js
          unit/db-write-contention.test.js
          unit/usage-rollup.test.js
          unit/usage-aggregation-source.test.js
          unit/usage-stats-snapshot.test.js
          unit/request-detail-summary.test.js
          unit/request-details-retention.test.js
          unit/retention-settings.test.js
          unit/realtime-time-filter.test.js
          unit/usage-dashboard-scope.test.js
          unit/chat-routing-telemetry.test.js
          unit/streaming-attempt-settlement.test.js
          unit/stream-terminal-persistence.test.js
          unit/glm53-thinking.test.js
          unit/codex-generic-sse-error.test.js
          unit/tool-stream-forwarding.test.js
          unit/openai-to-claude-response-tools.test.js
          unit/stream-first-token-timing.test.js
          unit/base-executor-retry.test.js
          unit/base-executor-socket-release.test.js
          unit/stream-stall-timer-cleanup.test.js
          unit/claude-messages-protocol.test.js
          unit/chatcore-stream-settle-hooks.test.js
          unit/compaction-diagnostics.test.js
          unit/codex-overload-retry-budget.test.js
          unit/codex-custom-tool-output.test.js
          unit/codex-tool-normalization.test.js
          unit/responses-tool-strictness.test.js
          unit/codex-scan-diagnostics.test.js
          unit/codebuddy-rate-limit.test.js
          unit/qianwen-provider.test.js
          unit/jevapi-provider.test.js
          unit/systemone.test.js
          unit/systemone-handler.test.js
          unit/systemone-access-settings.test.js
          unit/release-build-info.test.js
          unit/api-key-busy-retry.test.js
          unit/release-promotion.test.js
          unit/release-persistence-wal.test.js
          unit/release-smoke-summary.test.js
          unit/routing-events.test.js
          unit/routing-redis-client.test.js
          unit/connection-slots.test.js
          unit/route-lease.test.js
          unit/queue-retry-after.test.js
          unit/queue-timeout-response.test.js
          unit/error-response-status.test.js
          unit/admission-handoff-cancellation.test.js
          unit/request-conversation-latency.test.js
          unit/capability-account-selection.test.js
          unit/account-tag-routing.test.js
          unit/routing-observability.test.js
          unit/multi-account-fanout.test.js
          unit/routing-writer.test.js
          unit/outbound-cancellation-matrix.test.js
          unit/proxy-fetch-abort.test.js
          unit/client-disconnect-abort.test.js
          unit/abortable-deadline.test.js
          unit/quota-auto-ping.test.js
          unit/backup-litestream.test.js
          unit/backup-supervisor.test.js
          unit/backup-restore.test.js
          unit/backup-stage-restore.test.js
          unit/backup-litestream-lifecycle.test.js

      - name: Verify admission against isolated Redis
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y redis-server
          SM_REDIS_INTEGRATION=1 npm exec --prefix tests vitest run -- --config tests/vitest.config.js tests/integration/connection-leases.test.js

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            cache-slug: amd64
          # Run the ARM64 build natively. QEMU turns npm ci and Next's
          # compiler into a multi-hour/no-output process on ubuntu-latest.
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache-slug: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify Docker Hub credentials
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in GitHub Actions secrets before publishing."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=candidate-${{ github.sha }}
            type=sha,prefix=sha-

      - name: Build and push platform image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Push an untagged, canonical platform digest. The merge job creates
          # the shared multi-arch tags after both platforms finish.
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_BUILD_VERSION=${{ github.sha }}
            NPM_REGISTRY=https://registry.npmmirror.com
          cache-from: type=gha,scope=spring-mouse-${{ github.ref_name }}-${{ matrix.cache-slug }}
          cache-to: type=gha,mode=max,scope=spring-mouse-${{ github.ref_name }}-${{ matrix.cache-slug }}

      - name: Set up Node.js for same-image smoke
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install isolated smoke harness dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify built production image over real HTTP/TLS
        env:
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull "${REGISTRY_IMAGE}@${CANDIDATE_DIGEST}"
          node scripts/release-container-smoke.mjs "${REGISTRY_IMAGE}@${CANDIDATE_DIGEST}"

      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.cache-slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download platform digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=candidate-${{ github.sha }}
            type=sha,prefix=sha-
            # `latest` tracks the default branch, so every release build moves
            # it. AGENTS.md already documented this alias but no tag rule ever
            # produced it, so `latest` went stale and silently downgraded a
            # deployment to a pre-2026-10-08 image.
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect manifest list
        run: docker buildx imagetools inspect "${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}"
