name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js for release checks
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install application and test dependencies
        run: |
          npm install --ignore-scripts
          npm --prefix tests install --ignore-scripts
      - name: Run critical request-path regression tests
        working-directory: tests
        run: >-
          npm exec vitest run --
          --config vitest.config.js
          unit/network-traffic.test.js
          unit/ingress-usage.test.js
          unit/embedding-usage-persistence.test.js
          unit/fetch-success-clears-account.test.js
          unit/xai-video-handler.test.js
      - name: Verify Docker Hub credentials
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in GitHub Actions secrets before publishing."
            exit 1
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/spring-mouse
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_BUILD_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=spring-mouse-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=spring-mouse-${{ github.ref_name }}
